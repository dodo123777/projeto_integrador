<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Login - InfoHelp</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./static/css/login.css">
    </head>
    <body class="d-flex justify-content-center align-items-center min-vh-100 px-3 py-4">
        <!-- LOGIN FORM -->
        <div class="auth-card card align-items-center gap-3 border-0" id="loginForm">
            <img class="logo img-fluid d-block" src="./static/images/unisal-removebg-preview.png" alt="Logo UNISAL">
            <div class="app-title text-center fw-bold">InfoHelp</div>
            <div class="subtitle text-center fw-medium mb-2">Agenda Organizadora de Tarefas</div>
            <input class="form-control" type="email" id="loginEmail" placeholder="E-mail" required autocomplete="username">
            <input class="form-control" type="password" id="loginSenha" placeholder="Senha" required autocomplete="current-password">
            <button class="btn btn-primary w-100 fw-bold" id="loginBtn">Entrar</button>
            <button type="button" class="btn btn-link w-100 fw-semibold p-0 mt-1" id="openRegisterBtn">Registrar-se</button>
            <button type="button" class="btn btn-link w-100 fw-semibold p-0 mt-1" id="openResetBtn">Esqueci minha senha</button>
            <p class="erro m-0 text-center" id="erroLogin"></p>
        </div>

        <!-- REGISTRO FORM (inicia oculto) -->
        <div class="auth-card card align-items-center gap-3 border-0 d-none" id="registerForm">
            <button class="btn close-x position-absolute start-50 translate-middle-x w-auto p-0 m-0 fw-bold" aria-label="Voltar ao login" id="closeRegisterBtn">&times;</button>
            <img class="logo img-fluid d-block" src="./static/images/unisal-removebg-preview.png" alt="Logo UNISAL">
            <div class="app-title text-center fw-bold">Registrar novo usuário</div>
            <input class="form-control" type="text" id="regNome" placeholder="Nome completo" required>
            <input class="form-control" type="email" id="regEmail" placeholder="E-mail" required>
            <input class="form-control" type="password" id="regSenha" placeholder="Senha" required>
            <button class="btn btn-primary w-100 fw-bold" id="registerBtn">Registrar</button>
            <p class="erro m-0 text-center" id="erroRegistro"></p>
        </div>

        <!-- RESET FORM (inicia oculto) -->
        <div class="auth-card card align-items-center gap-3 border-0 d-none" id="resetForm">
            <button class="btn close-x position-absolute start-50 translate-middle-x w-auto p-0 m-0 fw-bold" aria-label="Voltar ao login" id="closeResetBtn">&times;</button>
            <img class="logo img-fluid d-block" src="./static/images/unisal-removebg-preview.png" alt="Logo UNISAL">
            <div class="app-title text-center fw-bold">Redefinir senha</div>
            <input class="form-control" type="email" id="resetEmail" placeholder="E-mail cadastrado" required>
            <input class="form-control" type="password" id="resetSenha" placeholder="Nova senha" required>
            <button class="btn btn-primary w-100 fw-bold" id="resetBtn">Redefinir senha</button>
            <p class="erro m-0 text-center" id="erroReset"></p>
        </div>

        <script src="./static/js/login.js"></script>
    </body>
</html>
