<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chat IA - InfoHelp</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./static/css/chat.css">
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"></script>
    </head>
    <body class="min-vh-100">
        <div class="chat-app container-fluid d-flex flex-column flex-lg-row gap-3 px-0">
            <aside class="assistant-panel card d-flex flex-column gap-3 p-3 order-1 order-lg-0 flex-shrink-0" aria-label="Painel do assistente">
                <a href="index.html" class="brand-link d-inline-flex align-items-center gap-2 text-decoration-none">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Agenda</span>
                </a>

                <div class="assistant-card card border-0">
                    <div class="assistant-mark d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <h1>Chat InfoHelp</h1>
                    <p>Ajuda para dividir tarefas, organizar prioridades e retomar o foco com passos pequenos.</p>
                </div>

                <div class="d-flex flex-column gap-2">
                    <span class="panel-label text-uppercase">Atalhos</span>
                    <button class="btn prompt-chip w-100 text-start fw-bold" type="button" data-prompt="Me ajude a transformar uma tarefa grande em passos pequenos.">
                        Dividir tarefa
                    </button>
                    <button class="btn prompt-chip w-100 text-start fw-bold" type="button" data-prompt="Monte um plano de foco de 25 minutos para eu começar agora.">
                        Plano de foco
                    </button>
                    <button class="btn prompt-chip w-100 text-start fw-bold" type="button" data-prompt="Como posso organizar minhas prioridades de hoje sem me sobrecarregar?">
                        Prioridades
                    </button>
                </div>
            </aside>

            <main class="chat-shell card d-flex flex-column flex-grow-1 overflow-hidden">
                <header class="chat-header d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-center gap-3">
                    <div>
                        <span class="eyebrow text-uppercase">Assistente de rotina</span>
                        <h2>Converse com a IA</h2>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button id="logoutBtn" class="btn logout-btn flex-fill">Sair</button>
                    </div>
                </header>

                <section id="chatMessages" class="chat-messages d-flex flex-column flex-grow-1 gap-3 overflow-y-auto" aria-live="polite"></section>

                <form id="chatForm" class="chat-form d-flex flex-column flex-sm-row gap-3 p-3">
                    <label class="visually-hidden" for="messageInput">Digite sua mensagem</label>
                    <textarea class="form-control flex-grow-1 p-3" id="messageInput" rows="1" placeholder="Escreva uma pergunta ou cole uma tarefa para organizar..."></textarea>
                    <button class="btn btn-primary d-inline-flex align-items-center justify-content-center gap-2 flex-shrink-0" id="sendButton" type="submit" aria-label="Enviar mensagem">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Enviar</span>
                    </button>
                </form>

                <p id="statusText" class="status-text m-0 fw-bold" aria-live="polite"></p>
            </main>
        </div>

        <script src="./static/js/auth.js"></script>
        <script src="./static/js/chat.js"></script>
    </body>
</html>
